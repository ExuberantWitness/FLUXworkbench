name: Release

# One-click installers for all three OSes. Push a tag like v0.2.0 →
#   build (matrix, parallel): embed python → build → smoke → package (no publish)
#     → upload each OS's installers as artifacts
#   publish (single job): download all artifacts → ONE GitHub Release upload.
# The single-writer publish avoids the electron-builder race where 3 legs
# publishing concurrently to the same release drop each other's assets.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            eb: "--linux"
          - os: windows-latest
            eb: "--win"
          # macos-latest is Apple Silicon; the embedded CPython is fetched for
          # the runner's arch, so build arm64 only. Intel dmg needs a macos-13
          # runner + x64 python — added in a later release.
          - os: macos-latest
            eb: "--mac --arm64"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # No `version:` here — it conflicts with the `packageManager` field in
      # package.json (pnpm/action-setup v4 errors on two sources). Let the
      # action read the pinned pnpm version from package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Bake a relocatable CPython (with brain deps) into dist-python/ for THIS
      # runner's OS. Users install nothing. GH_TOKEN authenticates the GitHub
      # API lookup (unauthenticated = 60/hr per IP → flaky on shared runners);
      # retry covers transient download failures.
      - name: Embed Python runtime
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3; do
            node scripts/fetch-python.mjs && exit 0
            echo "::warning::fetch-python failed (attempt $i/3), retrying in 15s…"; rm -rf dist-python; sleep 15
          done
          exit 1

      - name: Install JS deps
        shell: bash
        run: |
          for i in 1 2 3; do
            pnpm install --frozen-lockfile && exit 0
            echo "::warning::pnpm install failed (attempt $i/3), retrying in 10s…"; sleep 10
          done
          exit 1

      - name: Build renderer + main
        run: pnpm -r build

      # Prove the AI backend actually starts under THIS OS's embedded python
      # (numpy baked in, imports resolve) before we ship an installer. Runs
      # natively on windows/macOS/linux — the real Windows runtime check.
      - name: Smoke — embedded flux-insight lists chat
        shell: bash
        run: |
          if [ -f dist-python/python/python.exe ]; then PY="dist-python/python/python.exe"; else PY="dist-python/python/bin/python3"; fi
          "$PY" scripts/smoke_flux_insight.py "$PY"

      # Build the installers but DO NOT publish — a single downstream job does
      # that once, so concurrent legs can't clobber each other's uploads.
      - name: Package (no publish)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.eb }} --publish never
        shell: bash

      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List collected assets
        run: ls -la dist

      # Single writer → deterministic release. Create the release with all
      # assets; if the tag already has one (re-run), upload/clobber instead.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes "Flux Workbench $GITHUB_REF_NAME — one-click installers (Windows .exe / macOS arm64 .dmg / Linux .AppImage + .deb). The app bundles its own Python runtime; users install nothing."
          fi

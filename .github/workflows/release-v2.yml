# FLUXworkbench v2 release — build Linux AppImage + deb and publish to GitHub Releases.
# Flow: bump version in app/package.json → git tag vX.Y.Z → push tag.
# AppImage clients auto-update via electron-updater (latest-linux.yml in the release).
name: release-v2

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version pinned by "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @fluxworkbench/app build

      - name: Package and publish
        run: npx electron-builder --linux AppImage deb --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
